name: smart_player_pro
description: Smart Player Pro - professional Android video player with IPTV and downloads.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_vlc_player: ^7.4.4
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android: ^1.3.7
  flutter_riverpod: ^2.6.1
  permission_handler: ^11.4.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  device_info_plus: ^11.3.0
  connectivity_plus: ^6.1.3
  file_picker: ^10.1.2
  flutter_downloader: ^1.12.0
  wakelock_plus: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

